name: Crawl Rakumachi Properties

# NOTE: Scheduled run is disabled — rakumachi blocks GitHub Actions IPs (HTTP 403).
# Crawling is delegated to a local launchd job on the maintainer's machine
# (see scripts/run.sh + ~/Library/LaunchAgents/com.masmiyam.rakumachi-crawler.plist).
# This workflow remains available for ad-hoc manual runs only.
on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm ci

      - name: Install Playwright browsers
        run: |
          cd scripts
          npx playwright install chromium --with-deps

      - name: Run crawler
        env:
          MAX_PAGES: '200'
          DELAY_MS: '6000'
          MAX_RETRIES: '4'
          RETRY_BASE_MS: '10000'
        run: |
          cd scripts
          node crawler.js

      - name: Commit and push data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "push failed after 3 attempts"
          exit 1
